<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Weiterleitung...</title>
<style>
  body { font-family: sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background:#1b2a3b; color:#fff; }
  p { font-size:14px; letter-spacing:0.1em; opacity:0.6; }
</style>
<script>
  (function() {
    var path = window.location.pathname;
    // Match /artikel/ARTICLE_ID
    var match = path.match(/^\/artikel\/([^/]+)$/);
    if (match) {
      // Redirect to artikel.html with the same path
      // GitHub Pages will serve artikel.html for /artikel/* via this redirect
      window.location.replace('/artikel.html?id=' + match[1]);
    } else {
      window.location.replace('/');
    }
  })();
</script>
</head>
<body>
  <p>WEITERLEITUNG…</p>
</body>
</html>
