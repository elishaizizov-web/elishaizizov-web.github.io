name: Generate SEO Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # Daily at 03:00 UTC (catches new Firebase articles)
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate static SEO pages + sitemap
        run: node scripts/generate-seo.js

      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if something actually changed
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "chore: auto-generate SEO pages [skip ci]" &&
            git push origin main
          )
