name: Screenshot rabbisacks.org

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Take full-page screenshot
        run: |
          node - << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.setViewportSize({ width: 1280, height: 900 });
            await page.goto('https://rabbisacks.org/', { waitUntil: 'networkidle', timeout: 30000 });
            await page.screenshot({ path: 'rabbisacks_fullpage.png', fullPage: true });
            await browser.close();
            console.log('Done!');
          })();
          EOF

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: rabbisacks-screenshot
          path: rabbisacks_fullpage.png
