<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --navy: #1b2a3b;
  --navy-light: #2c3e52;
  --gold: #b8952a;
  --gold-light: #d4aa40;
  --white: #ffffff;
  --off-white: #f8f6f2;
  --text: #2a2420;
  --text-soft: #4a4440;
  --rule: #dcd8d0;
  color-scheme: light only;
}

body {
  font-family: 'Source Serif 4', Georgia, serif;
  background: #ffffff !important;
  color: #2a2420 !important;
  -webkit-font-smoothing: antialiased;
}

/* PAGE NAV */
.page-nav {
  background: #fff;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: center;
  gap: 0

/* NAV */
.lang-bar { background:var(--navy); display:flex; justify-content:space-between; align-items:center; padding:0 32px; }
.lang-bar-left { display:flex; align-items:center; gap:12px; }
.site-name-link { font-family:'Raleway',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.7); text-decoration:none; padding:14px 0; }
.site-name-link:hover { color:#fff; }
.lang-bar-right { display:flex; }
.lang-btn { background:none; border:none; border-left:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.4); font-family:'Raleway',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; padding:11px 14px; cursor:pointer; transition:color 0.2s; }
.lang-btn:hover { color:rgba(255,255,255,0.9); }
.lang-btn.active { color:var(--gold-light); }

/* ARTICLE PAGE */
.artikel-wrap { max-width:720px; margin:0 auto; padding:48px 32px 80px; }
.art-back { display:inline-flex; align-items:center; gap:6px; font-family:'Raleway',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-soft); text-decoration:none; margin-bottom:36px; transition:color 0.2s; }
.art-back:hover { color:var(--navy); }
.art-date { font-family:'Raleway',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:14px; }
.art-title { font-family:'Playfair Display',Georgia,serif; font-size:36px; font-weight:700; color:var(--navy); line-height:1.25; margin-bottom:28px; }
.art-img { width:100%; max-height:420px; object-fit:cover; display:block; margin-bottom:32px; border-radius:2px; }
.art-body { font-size:17px; line-height:1.85; color:var(--text); }
.art-body p { margin-bottom:1.2em; }
.art-body h2 { font-family:'Playfair Display',serif; font-size:22px; color:var(--navy); margin:1.6em 0 0.6em; }
.art-body h3 { font-family:'Playfair Display',serif; font-size:18px; color:var(--navy); margin:1.4em 0 0.5em; }
.art-body blockquote { border-left:3px solid var(--gold); padding-left:20px; color:var(--text-soft); font-style:italic; margin:1.4em 0; }

/* ACTION BAR */
.art-action-bar { display:flex; flex-wrap:wrap; gap:10px; margin-top:48px; padding-top:28px; border-top:1px solid var(--rule); }
.action-btn { display:inline-flex; align-items:center; gap:7px; font-family:'Raleway',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; padding:11px 20px; border-radius:2px; cursor:pointer; transition:all 0.2s; text-decoration:none; border:none; }
.action-btn-wa { background:#25d366; color:#fff; }
.action-btn-wa:hover { background:#1ebe5d; }
.action-btn-copy { background:var(--navy); color:#fff; }
.action-btn-copy:hover { background:var(--navy-light); }
.action-btn-print { background:#fff; color:var(--navy); border:1px solid var(--rule); }
.action-btn-print:hover { border-color:var(--navy); }
.action-btn-pdf { background:var(--gold); color:#fff; }
.action-btn-pdf:hover { background:var(--gold-light); }

/* FOOTER */
footer { background:var(--navy); color:rgba(255,255,255,0.5); text-align:center; padding:24px 32px; font-family:'Raleway',sans-serif; font-size:10px; letter-spacing:0.1em; margin-top:60px; }

/* PRINT */
@media print {
  .lang-bar, .art-back, .art-action-bar, footer { display:none !important; }
  .artikel-wrap { padding:0; max-width:100%; }
  .art-title { font-size:28px; }
  .art-body { font-size:14px; line-height:1.7; }
}

/* RTL support */
.rtl { direction:rtl; text-align:right; }
</style>
</head>
<body>

<!-- NAV -->
<nav class="lang-bar">
  <div class="lang-bar-left">
    <a class="site-name-link" href="https://elishaizizov.com">← elishaizizov.com</a>
  </div>
  <div class="lang-bar-right">
    <button class="lang-btn active" onclick="switchLang('de')" id="lb-de">DE</button>
    <button class="lang-btn" onclick="switchLang('en')" id="lb-en">EN</button>
    <button class="lang-btn" onclick="switchLang('fr')" id="lb-fr">FR</button>
    <button class="lang-btn" onclick="switchLang('es')" id="lb-es">ES</button>
    <button class="lang-btn" onclick="switchLang('ru')" id="lb-ru">RU</button>
    <button class="lang-btn" onclick="switchLang('he')" id="lb-he">עב</button>
  </div>
</nav>

<!-- CONTENT -->
<div class="artikel-wrap">
  <a class="art-back" href="https://elishaizizov.com">&#8592; Zurück zur Website</a>

  <div id="art-loading" style="padding:60px 0; text-align:center; font-family:'Raleway',sans-serif; color:var(--text-soft); letter-spacing:0.1em; font-size:12px;">LADEN…</div>

  <div id="art-content" style="display:none;">
    <span class="art-date" id="art-date"></span>
    <h1 class="art-title" id="art-title"></h1>
    <img id="art-img" src="" alt="" class="art-img" style="display:none;">
    <div class="art-body" id="art-body"></div>

    <!-- ACTION BAR -->
    <div class="art-action-bar">
      <a class="action-btn action-btn-wa" id="btn-wa" href="#" target="_blank" rel="noopener">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378L.057 22l1.649-6.079a9.925 9.925 0 0 1-1.334-4.93c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/></svg>
        WhatsApp
      </a>
      <button class="action-btn action-btn-copy" id="btn-copy" onclick="copyLink()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Link kopieren
      </button>
      <button class="action-btn action-btn-print" onclick="window.print()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Drucken
      </button>
      <button class="action-btn action-btn-pdf" onclick="downloadPDF()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        PDF
      </button>
    </div>
  </div>

  <div id="art-error" style="display:none; padding:60px 0; text-align:center; font-family:'Raleway',sans-serif; color:#c0392b; font-size:14px;">
    Beitrag nicht gefunden. <a href="https://elishaizizov.com" style="color:var(--navy);">← Zurück</a>
  </div>
</div>

<footer>
  &copy; Rabbiner Elishai Zizov &mdash; Frankfurt am Main
</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmEpaog0ZVYI4ZU87IfcjiSbRizQITn5o",
  authDomain: "elishai-zizov.firebaseapp.com",
  projectId: "elishai-zizov",
  storageBucket: "elishai-zizov.firebasestorage.app",
  messagingSenderId: "336975073982",
  appId: "1:336975073982:web:b4d9f466b7dc476531c4ef",
  measurementId: "G-R4DL0C3PFW"
};

// Initialize Firebase only once
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.firestore();

let currentLang = 'de';
let currentArticle = null;

// Get article ID from URL path: /artikel/ARTICLE_ID
function getArticleIdFromUrl() {
  // Support both /artikel/ID (direct) and /artikel.html?id=ID (from 404 redirect)
  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) return params.get('id');
  const path = window.location.pathname;
  const match = path.match(/\/artikel\/([^/]+)$/);
  return match ? match[1] : null;
}

async function loadArticle() {
  const id = getArticleIdFromUrl();
  if (!id) { showError(); return; }
  try {
    const doc = await db.collection('articles').doc(id).get();
    if (!doc.exists) { showError(); return; }
    currentArticle = { id: doc.id, ...doc.data() };
    renderArticle(currentArticle, currentLang);
  } catch(e) {
    console.error(e);
    showError();
  }
}

function renderArticle(a, lang) {
  const tr = (a.translations && a.translations[lang]) ? a.translations[lang] : { title: a.title || '', text: a.text || '' };
  const title = tr.title || a.title || '';
  const text  = tr.text  || a.text  || '';
  const isRTL = lang === 'he';

  document.getElementById('art-loading').style.display = 'none';
  document.getElementById('art-content').style.display = 'block';
  document.getElementById('art-date').textContent  = a.date || '';
  document.getElementById('art-title').textContent = title;
  document.getElementById('art-title').className   = 'art-title' + (isRTL ? ' rtl' : '');
  document.getElementById('art-body').innerHTML    = text;
  document.getElementById('art-body').className    = 'art-body' + (isRTL ? ' rtl' : '');

  const img = document.getElementById('art-img');
  if (a.image) { img.src = a.image; img.alt = title; img.style.display = 'block'; }
  else { img.style.display = 'none'; }

  // page title + OG
  document.title = title + ' | Rabbiner Elishai Zizov';
  document.getElementById('page-desc').setAttribute('content', title);
  document.getElementById('og-title').setAttribute('content', title);
  document.getElementById('og-desc').setAttribute('content', title);
  if (a.image) document.getElementById('og-image').setAttribute('content', a.image);
  const pageUrl = 'https://elishaizizov.com/artikel/' + a.id;
  document.getElementById('og-url').setAttribute('content', pageUrl);

  // WhatsApp link
  const waText = encodeURIComponent(title + '\n\n' + pageUrl);
  document.getElementById('btn-wa').href = 'https://wa.me/?text=' + waText;

  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.id === 'lb-' + lang));

  // Back label
  const backLabels = { de:'Zurück zur Website', en:'Back to website', fr:'Retour au site', es:'Volver al sitio', ru:'На сайт', he:'חזרה לאתר' };
  document.querySelector('.art-back').textContent = '← ' + (backLabels[lang] || 'Zurück');
}

function switchLang(lang) {
  currentLang = lang;
  if (currentArticle) renderArticle(currentArticle, lang);
}

function showError() {
  document.getElementById('art-loading').style.display = 'none';
  document.getElementById('art-error').style.display   = 'block';
}

function copyLink() {
  const url = window.location.href;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.textContent = '✓ Kopiert!';
    setTimeout(() => { btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Link kopieren'; }, 2500);
  });
}

function downloadPDF() {
  window.print();
}

loadArticle();
</script>
</body>
</html>
